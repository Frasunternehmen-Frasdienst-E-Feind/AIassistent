<title>Feind Marketing Cockpit</title>
<meta name="description" content="Marketing-Cockpit der Fräsdienst-Service E. Feind GmbH: Content, Leads, Ausschreibungen, Events, SEO und Referenzen live aus dem Artefakt-Speicher.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo:wght@600;700&display=swap">
<style>
/* Tokens: einzige Quelle branding/feind-ci.tokens.json */
:root{
  --accent:#84bb20; --accent-text:#5e8a14; --on-accent:#424e4e;
  --signal:#e3000b; --signal-text:#b8000a;
  --surface:#ffffff; --surface-muted:#f2f4f4; --surface-inverse:#424e4e;
  --ink:#3c5457; --ink-strong:#424e4e; --ink-muted:#6b7575; --ink-inverse:#ffffff;
  --line:#d5dada; --focus:#424e4e;
  --ground:var(--surface-muted); --panel:var(--surface); --raised:var(--surface-muted);
  --accent-soft:color-mix(in srgb, var(--accent) 16%, var(--panel));
  --font-display:Exo,"Arial Black",Arial,sans-serif;
  --font-sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:0px; --r-input:2px; --r-btn:4px;
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:40px; --s6:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --accent:#84bb20; --accent-text:#84bb20; --on-accent:#424e4e;
    --signal:#e3000b; --signal-text:#ff9a9f;
    --surface:#2e3737; --surface-muted:#384242; --surface-inverse:#1f2525;
    --ink:#e7ecec; --ink-strong:#ffffff; --ink-muted:#b8bfbf; --ink-inverse:#ffffff;
    --line:#4d5858; --focus:#84bb20;
    --ground:var(--surface); --panel:var(--surface-muted); --raised:var(--surface);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --accent:#84bb20; --accent-text:#84bb20; --on-accent:#424e4e;
  --signal:#e3000b; --signal-text:#ff9a9f;
  --surface:#2e3737; --surface-muted:#384242; --surface-inverse:#1f2525;
  --ink:#e7ecec; --ink-strong:#ffffff; --ink-muted:#b8bfbf; --ink-inverse:#ffffff;
  --line:#4d5858; --focus:#84bb20;
  --ground:var(--surface); --panel:var(--surface-muted); --raised:var(--surface);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);color:var(--ink-strong);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:20px} h3{font-size:15px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px}
@media (min-width:760px){.wrap{padding-inline:24px}}
.muted{color:var(--ink-muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Kopf */
.top{background:var(--surface-inverse);color:var(--ink-inverse);border-bottom:4px solid var(--accent)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s3);padding-block:var(--s3)}
.brand{display:flex;align-items:center;gap:var(--s2) var(--s3);flex-wrap:wrap}
.brand h1{color:var(--ink-inverse);font-size:22px;letter-spacing:.01em}
.brand .mark{width:14px;height:14px;background:var(--accent);flex:none}
.brand .date{font-size:14px;opacity:.85}
.seg{display:inline-flex;border:1px solid color-mix(in srgb, var(--ink-inverse) 45%, transparent);border-radius:var(--r-btn);overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink-inverse);padding:6px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}

.bar2{background:var(--panel);border-bottom:1px solid var(--line)}
.bar2 .wrap{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:flex-end;justify-content:space-between;padding-block:var(--s2) var(--s3)}
.sync{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);align-items:center;min-width:0}
.sync .it{font-size:12px;padding:2px 8px;border:1px solid var(--line);background:var(--raised);white-space:nowrap}
.sync .it b{color:var(--ink-strong);font-weight:700}
.sync .it.never{color:var(--ink-muted)}
.filters{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3)}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field label,.field .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);font-weight:700}
select,input[type="search"],input[type="text"]{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-input);padding:6px 8px;min-height:34px;max-width:100%;color:var(--ink)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;min-height:34px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-strong);border-radius:var(--r-btn);padding:6px 12px;min-height:34px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--ink-muted)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}

.banner{margin-top:var(--s3);border:1px solid var(--line);border-left:6px solid var(--ink-strong);background:var(--panel);padding:var(--s2) var(--s3);display:flex;gap:var(--s2);align-items:flex-start}
.banner.err{border-left-color:var(--signal)}
.banner strong{color:var(--ink-strong)}

main{display:flex;flex-direction:column;gap:var(--s3);padding-block:var(--s3) var(--s5)}

/* Copilot */
.copilot{background:var(--panel);border:1px solid var(--line);padding:var(--s3)}
.copilot-head{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;justify-content:space-between}
.copilot-head h2{display:flex;align-items:center;gap:var(--s2)}
.copilot-head h2 .tag{font-family:var(--font-sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:2px 6px;font-weight:700}
.copilot-grid{display:grid;grid-template-columns:1fr;gap:var(--s3);margin-top:var(--s3)}
@media (min-width:980px){.copilot-grid{grid-template-columns:3fr 2fr}}
.brief-summary{max-width:70ch;margin:0 0 var(--s2)}
.sev-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s1)}
.sev-list li{display:flex;gap:var(--s2);align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.sev-list li:first-child{border-top:0}
.sev-list .txt{flex:1;min-width:0}
.linkbtn{background:none;border:0;padding:0;color:var(--ink-strong);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:13px}
.hint-num{font-family:var(--font-display);font-size:20px;color:var(--ink-strong);min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.week{width:100%;border-collapse:collapse;font-size:14px;margin-top:var(--s2)}
.week th,.week td{text-align:left;padding:4px 8px 4px 0;border-top:1px solid var(--line);vertical-align:top}
.ai{margin-top:var(--s3);border-top:1px solid var(--line);padding-top:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.ai-row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.ai pre{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--raised);border:1px solid var(--line);padding:var(--s2);font-size:12px;max-height:220px;overflow:auto}

/* Chips / Ampel */
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border:1px solid var(--line);font-size:12px;line-height:18px;white-space:nowrap;background:var(--panel);color:var(--ink)}
.chip svg{width:10px;height:10px;flex:none}
.chip.red{background:var(--signal);border-color:var(--signal);color:var(--ink-inverse);font-weight:700}
.chip.red svg{fill:var(--ink-inverse)}
.chip.yellow{background:var(--raised);border:1px dashed var(--ink-strong);color:var(--ink-strong);font-weight:700}
.chip.yellow svg{fill:var(--ink-strong)}
.chip.green{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chip.green svg{fill:var(--on-accent)}
.chip.gone{color:var(--ink-muted)}
.chip.gone svg{fill:var(--ink-muted)}
.chip.soft{background:var(--raised)}
.chips{display:flex;flex-wrap:wrap;gap:4px}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:2px solid var(--line)}
.tab{background:transparent;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 14px;cursor:pointer;color:var(--ink);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink-strong);font-weight:700}
.tab .cnt{font-size:12px;background:var(--raised);border:1px solid var(--line);padding:0 6px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{justify-content:space-between;border-bottom-width:3px}}

.panel{background:var(--panel);border:1px solid var(--line);border-top:0;padding:var(--s3)}
.panel-head{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.panel-head .ttl{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.panel-head .count{font-size:14px;color:var(--ink-muted)}
.panel-head .right{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.tools{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:flex-end;margin-bottom:var(--s3)}
.section{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s4)}
.section:first-child{margin-top:0}
.empty{border:1px dashed var(--line);padding:var(--s3);background:var(--raised);max-width:72ch}
.empty strong{color:var(--ink-strong)}
.empty code,.path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--raised);border:1px solid var(--line);padding:0 4px;word-break:break-all}

/* Karten */
.card{background:var(--surface);border:1px solid var(--line);padding:var(--s2) 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{color:var(--ink-strong);font-weight:700;overflow-wrap:anywhere}
.card .meta{font-size:12.5px;color:var(--ink-muted);overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s2)}
.col{background:var(--raised);border:1px solid var(--line);padding:var(--s2);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);border-bottom:2px solid var(--line);padding-bottom:4px}
.col-h h3{font-size:14px}
.col-h.win{border-bottom-color:var(--accent)}
.col-h.lost{border-bottom-color:var(--ink-muted)}
.col .none{font-size:12.5px;color:var(--ink-muted)}

/* Kalender */
.cal-nav{display:flex;align-items:center;gap:var(--s2)}
.cal-nav .m{font-family:var(--font-display);color:var(--ink-strong);min-width:12ch;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.cal .dh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);font-weight:700;padding:4px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--raised)}
.cal .d{min-height:84px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--surface)}
.cal .d.out{background:var(--raised)}
.cal .d.out .n{color:var(--ink-muted)}
.cal .d .n{font-size:12px;font-variant-numeric:tabular-nums}
.cal .d.today .n{background:var(--accent);color:var(--on-accent);font-weight:700;align-self:flex-start;padding:0 4px}
.cal .ev{font-size:11.5px;line-height:1.3;padding:1px 4px;border:1px solid var(--line);background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.pub{background:var(--accent-soft)}
.agenda{display:none;list-style:none;margin:0;padding:0}
.agenda li{display:flex;gap:var(--s2);padding:6px 0;border-top:1px solid var(--line);align-items:flex-start}
.agenda .dd{font-variant-numeric:tabular-nums;min-width:6ch;color:var(--ink-strong);font-weight:700}
@media (max-width:700px){.cal{display:none}.agenda{display:block}}

/* Balken */
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:minmax(80px,11rem) 1fr 3ch;gap:var(--s2);align-items:center;font-size:13px}
.brow .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .track{height:14px;background:var(--raised);border:1px solid var(--line);position:relative}
.brow .fill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.brow .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-strong)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--s3)}

/* Ausschreibungen */
.tlist{display:flex;flex-direction:column;gap:var(--s2)}
.trow{display:grid;grid-template-columns:150px 1fr;gap:var(--s2) var(--s3);background:var(--surface);border:1px solid var(--line);padding:12px}
.trow .when{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.trow .when .dt{font-family:var(--font-display);color:var(--ink-strong);font-size:16px;font-variant-numeric:tabular-nums}
.trow .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.trow .fit{display:flex;gap:var(--s2);align-items:flex-start;font-size:13.5px}
.trow a{color:var(--ink-strong);text-underline-offset:2px}
@media (max-width:560px){.trow{grid-template-columns:1fr}}

/* Events */
.timeline{display:flex;flex-direction:column;gap:var(--s3);border-left:2px solid var(--line);margin-left:6px;padding-left:var(--s3)}
.tl-item{position:relative;display:flex;flex-direction:column;gap:var(--s2)}
.tl-item::before{content:"";position:absolute;left:calc(-1 * var(--s3) - 7px);top:6px;width:12px;height:12px;background:var(--accent);border:2px solid var(--panel)}
.tl-item.past::before{background:var(--ink-muted)}
.ev-card{background:var(--surface);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:var(--s2)}
.ev-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s2)}
.ev-date{font-family:var(--font-display);color:var(--ink-strong);font-variant-numeric:tabular-nums}
.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px var(--s3)}
.prow{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.prow .pl{display:flex;justify-content:space-between;gap:var(--s2)}
.ptrack{height:8px;background:var(--raised);border:1px solid var(--line);position:relative}
.pfill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
details.chk summary{cursor:pointer;font-size:14px;color:var(--ink-strong);padding:4px 0}
.chk-group{margin-top:var(--s2)}
.chk-group ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.chk-group label{display:flex;gap:var(--s2);align-items:flex-start;font-size:14px;padding:3px 0;cursor:pointer}
.chk-group input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.chk-group input:disabled + span{color:var(--ink)}
.post{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center;font-size:14px;border-top:1px solid var(--line);padding-top:var(--s2)}

/* SEO */
.tbl-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);max-width:100%;min-width:0}
.section>*{min-width:0;max-width:100%}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}
table.data th,table.data td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.data th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);background:var(--raised);white-space:nowrap}
table.data td.r,table.data th.r{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--accent-text);font-weight:700}
.down{color:var(--signal-text);font-weight:700}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);padding:var(--s2)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-muted);font-size:11px;font-family:var(--font-sans)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2}
.chart .area{fill:var(--accent-soft);stroke:none}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--ink-muted);stroke-width:1;stroke-dasharray:3 3}
.chart .endlbl{fill:var(--ink-strong);font-size:12px;font-weight:700;font-family:var(--font-sans)}
.tip{position:absolute;pointer-events:none;background:var(--surface-inverse);color:var(--ink-inverse);font-size:12px;padding:4px 8px;white-space:nowrap}
.gaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s2)}

/* Referenzen */
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s2)}
.refs .card ul{margin:0;padding-left:18px;font-size:13.5px}
.refs .files{display:flex;flex-direction:column;gap:2px}
.noclient{font-style:italic;color:var(--ink-muted)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));max-width:520px;margin:0 auto;background:var(--surface-inverse);color:var(--ink-inverse);padding:10px 14px;border-left:6px solid var(--accent);z-index:10}
.toast.err{border-left-color:var(--signal)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>Feind Marketing Cockpit</h1>
      <span class="date" id="today-label"></span>
    </div>
    <div class="seg" role="group" aria-label="Darstellung">
      <button type="button" id="theme-auto" data-theme-set="auto" aria-pressed="true">Auto</button>
      <button type="button" id="theme-light" data-theme-set="light" aria-pressed="false">Hell</button>
      <button type="button" id="theme-dark" data-theme-set="dark" aria-pressed="false">Dunkel</button>
    </div>
  </div>
</header>
<div class="bar2">
  <div class="wrap">
    <div class="field" style="min-width:0">
      <span class="label">Sync-Stand</span>
      <div class="sync" id="sync"></div>
    </div>
    <div class="filters">
      <div class="field">
        <label for="f-region">Region</label>
        <select id="f-region"><option value="">Alle Regionen</option></select>
      </div>
      <div class="field">
        <label for="f-range">Zeitraum</label>
        <select id="f-range">
          <option value="all">Alles</option>
          <option value="7">± 7 Tage um heute</option>
          <option value="30">± 30 Tage um heute</option>
          <option value="90">± 90 Tage um heute</option>
          <option value="365">± 12 Monate um heute</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="banner-slot"></div>
  <main>
    <section class="copilot" aria-labelledby="copilot-h" id="copilot"></section>
    <section aria-label="Module">
      <div class="tabs" role="tablist" aria-label="Module" id="tabs"></div>
      <div id="panels"></div>
    </section>
    <p class="muted small" id="range-note"></p>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

/* ---------- Konstanten ---------- */
const DEFAULTS = { staleDraftDays: 14, followupDays: 5, tenderRedDays: 3, tenderYellowDays: 7, regions: [] };
const MODULES = [
  { key: 'content',    label: 'Content-Pipeline', short: 'Content',       cols: ['content'],    skill: 'content-pipeline' },
  { key: 'leads',      label: 'Lead-Pipeline',    short: 'Leads',         cols: ['leads'],      skill: 'lead-tracking' },
  { key: 'tenders',    label: 'Ausschreibungs-Monitor', short: 'Ausschreibungen', cols: ['tenders'], skill: 'tender-monitoring' },
  { key: 'events',     label: 'Event-Planung',    short: 'Events',        cols: ['events'],     skill: 'event-planning' },

  if (d < 0) return { level: 'gone', text: 'abgelaufen', days: d };

  const lbl = d === 0 ? 'heute' : d === 1 ? 'morgen' : 'in ' + d + ' Tagen';

function filtered(key) {

  switch (key) {
    case 'content': {
      const m = S.mod.content;
      return d.content.filter(c => matchRegion(c) && inRange(contentDate(c)) && (!m.channel || c.channel === m.channel) && (!m.ptype || str(c.projectType) === m.ptype));
    }
    case 'leads': {
      const m = S.mod.leads;
      return d.leads.filter(l => matchRegion(l) && inRange(parseDay(l.lastContact) || parseDay(l.createdAt)) && (!m.channel || l.channel === m.channel) && (!m.dueOnly || leadFollowup(l) != null));
    }
    case 'tenders': {
      const m = S.mod.tenders;
      return d.tenders.filter(t => matchRegion(t) && inRange(parseDay(t.deadline)) && (!m.fit || t.fit === m.fit) && (m.showClosed || tenderOpen(t)));
    }
    case 'events':
      return d.events.filter(e => { const a = parseDay(e.date); return spanInRange(a, parseDay(e.endDate) || a); });
    case 'seo':
      return d.seo_keywords.filter(k => matchRegion(k) && inRange(parseDay(k.checkedAt)));
    case 'references': {
      const m = S.mod.references, q = m.q.trim().toLowerCase();

        if (m.service && !arr(r.services).map(str).includes(m.service)) return false;

}

  if (json.length > 50000) json = json.slice(0, 50000);
  const prompt = [
    'Du bist der Feind Copilot für das Marketing der Fräsdienst-Service E. Feind GmbH (Straßenfräsen, Baudienstleistung).',
    `Erstelle den Tagesbrief für ${today} ausschließlich aus den Daten unten.`,
    'Regeln: Deutsch, sachlich, knapp. Keine erfundenen Zahlen, Namen, Termine oder Fakten – verwende nur, was in den Daten steht. Wenn Daten fehlen, sag das. Keine Personennamen, keine Preise. Rechtliche oder vertragliche Fragen nur mit dem Hinweis „Bitte Rechtsabteilung prüfen.“',

function lineChart(points, metric) {

  }

  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  if (!inv && points.length > 1) svg.append(s('path', { class: 'area', d: `${d}L${x(points.length - 1)},${y(ylo)}L${x(0)},${y(ylo)}Z` }));
  svg.append(s('path', { class: 'line', d }));
  const last = points[points.length - 1];
  svg.append(s('circle', { class: 'dot', cx: x(points.length - 1), cy: y(last.v), r: 5 }),
    s('text', { class: 'endlbl', x: x(points.length - 1) + 8, y: y(last.v) + 4 }, fmt(last.v)));
  const xh = s('line', { class: 'xh', y1: m.t, y2: H - m.b, x1: 0, x2: 0, visibility: 'hidden' });
  const hd = s('circle', { class: 'dot', r: 5, cx: 0, cy: 0, visibility: 'hidden' });

  const tip = h('div', { class: 'tip', hidden: true });

  svg.append(hit);

    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;

}

/* ---------- Daten ---------- */
function docObj(d) { const x = d.data() || {}; return { ...x, _id: d.id }; }
function subscribe(db) {
  for (const c of ALL_COLS) {
    db.collection(c).onSnapshot(snap => {
      S.data[c] = snap.docs.map(docObj); S.loaded[c] = true; delete S.errors[c]; scheduleRender();
    }, err => {
      S.loaded[c] = true; S.errors[c] = (err && err.code) || 'unavailable';
      if (err && err.code === 'revoked') { S.dbState = 'none'; S.db = null; }
      scheduleRender();
    });
  }
  db.doc('meta/sync').onSnapshot(snap => { S.meta = snap.exists ? snap.data() : null; scheduleRender(); }, () => {});
  db.doc('settings/general').onSnapshot(snap => {
    const d = snap.exists ? snap.data() || {} : {};
    S.settingsFound = snap.exists;
    S.settings = {
      staleDraftDays: numOr(d.staleDraftDays, DEFAULTS.staleDraftDays), followupDays: numOr(d.followupDays, DEFAULTS.followupDays),
      tenderRedDays: numOr(d.tenderRedDays, DEFAULTS.tenderRedDays), tenderYellowDays: numOr(d.tenderYellowDays, DEFAULTS.tenderYellowDays),
      regions: arr(d.regions).map(str).filter(Boolean),
    };
    scheduleRender();
  }, () => {});
  const today = ymd(today0());
  db.doc('briefings/' + today).onSnapshot(snap => {
    if (snap.exists) S.briefing = snap.data();
    else if (!(S.briefing && S.briefing._unsaved)) S.briefing = null;
    scheduleRender();
  }, () => {});
}

async function init() {
  initTheme();
  buildTabs();
  const f = S.filters;
  const sr = storeGet('fmc-range'); if (sr && ['all','7','30','90','365'].includes(sr)) f.range = sr;
  $('f-range').value = f.range;
  $('f-region').addEventListener('change', e => { f.region = e.target.value; scheduleRender(); });
  $('f-range').addEventListener('change', e => { f.range = e.target.value; storeSet('fmc-range', f.range); scheduleRender(); });
  const hash = (location.hash || '').slice(1);
  const savedTab = storeGet('fmc-tab');
  const start = MODULES.some(m => m.key === hash) ? hash : MODULES.some(m => m.key === savedTab) ? savedTab : 'content';
  selectTab(start, false);
  renderAll();
  let resizeT = null;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.tab === 'seo') renderModule('seo'); }, 150); });

  const c = window.claude;
  if (!c || typeof c.use !== 'function') { S.dbState = 'none'; renderAll(); return; }
  const [db, sample] = await Promise.all([
    Promise.resolve().then(() => c.use('db')).catch(() => null),
    Promise.resolve().then(() => c.use('sample')).catch(() => null),
  ]);
  S.sample = typeof sample === 'function' ? sample : null;
  if (!db) { S.dbState = 'none'; renderAll(); return; }
  S.db = db; S.dbState = 'ok';
  subscribe(db);
  renderAll();
}
init();
})();
</script>
