name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Demo-Lauf über installierten Befehl (aus fremdem Ordner)
        run: |
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          SEO_REPORTING_CONFIG="$GITHUB_WORKSPACE/config.example.yaml" seo-report monthly --demo --as-of 2026-09-01
          test -f output/monthly_2026-08-01_2026-08-31_demo.md

  cockpit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cockpit
      - run: npm run test:cockpit:e2e

  zeiterfassung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: zeiterfassung/go.mod
          cache: false
      - name: Go vet + Tests der Stempeluhr
        working-directory: zeiterfassung
        run: |
          go vet ./...
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: JS-Tests der Zeiterfassung
        run: npm test
