name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Demo-Lauf über installierten Befehl (aus fremdem Ordner)
        run: |
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          SEO_REPORTING_CONFIG="$GITHUB_WORKSPACE/config.example.yaml" seo-report monthly --demo --as-of 2026-09-01
          test -f output/monthly_2026-08-01_2026-08-31_demo.md

  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit-Tests Feind Cockpit (FeindCore)
        run: node --test cockpit/test/*.test.mjs
      - name: Abhängigkeiten (jsPDF für die Brennglas-Tests)
        run: npm ci --ignore-scripts
      - name: Unit-Tests Cockpit A1 (Notion-Aufgaben, Brennglas-PDF)
        run: node --test cockpit-a1/test/*.test.mjs
      - name: Migrationsplan gegen Live-Fixture (Dry-Run)
        run: |
          node -e "import('./cockpit/test/fixtures/live-2026-09-28.mjs').then(m=>{const fs=require('fs');for(const k of ['target','a2','a3'])fs.writeFileSync('/tmp/'+k+'.json',JSON.stringify(m.default[k]));})"
          node cockpit/tools/migrate.mjs --target /tmp/target.json --a2 /tmp/a2.json --a3 /tmp/a3.json | tee /tmp/plan.txt
          grep -q "0 Löschungen" /tmp/plan.txt
