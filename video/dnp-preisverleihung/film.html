<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: Exo; font-weight: 900; src: url(node_modules/@fontsource/exo/files/exo-latin-900-normal.woff2) format("woff2"); }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; overflow: hidden; font: 900 112px/1.12 Exo, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .szene { position: absolute; inset: 0; overflow: hidden; }
  .voll { position: absolute; width: 100%; height: 100%; object-fit: cover; }
  .schild { position: absolute; left: 120px; padding: 16px 40px 24px; }
  .klein { top: 96px; font-size: 64px; padding: 10px 28px 16px; }
  .kante { position: absolute; top: 0; width: 10px; height: 100%; background: var(--gruen); }
  .text { position: absolute; left: 120px; }
  svg { position: absolute; inset: 0; }
</style>

<div class="szene" id="a1" style="background: var(--hell); color: var(--anthrazit)">
  <div class="text" id="t1" style="top: 110px"></div>
  <svg id="g1" width="1920" height="1080"></svg>
</div>

<div class="szene" id="a2">
  <img class="voll" id="maschine" src="bilder/maschine-pflaster.jpg">
  <div class="schild" id="t2" style="top: 820px; background: var(--gruen); color: var(--auf-gruen); font-size: 104px"></div>
</div>

<div class="szene" id="vn">
  <img class="voll" src="bilder/pflaster-vorher.jpg">
  <div class="schild klein" id="lv" style="background: var(--anthrazit); color: var(--weiss)"></div>
  <div class="szene" id="nach">
    <img class="voll" src="bilder/pflaster-nachher.jpg">
    <div class="schild klein" id="ln" style="background: var(--gruen); color: var(--auf-gruen)"></div>
  </div>
  <div class="kante" id="k3"></div>
</div>

<div class="szene" id="a3" style="background: var(--anthrazit); color: var(--weiss)">
  <svg id="g3" width="1920" height="1080"></svg>
  <div class="text" id="t3" style="top: 130px"></div>
  <img id="logo" src="../../messe/rotterdam-2027/assets/logo-service-white.png" style="position: absolute; right: 64px; bottom: 48px; height: 132px">
</div>

<div class="kante" id="k1"></div>
<div class="kante" id="k2"></div>

<script>
  const W = 1920, FPS = 30;
  const A2 = 110;   // Maschine auf dem Pflaster
  const VN = 190;   // echtes Vorher/Nachher
  const A3 = 275;   // Ergebnis
  const ENDE = 435; // 14,5 s
  const OBERKANTE = 760, STEIN = 80, RADIUS = 70;
  const $ = (id) => document.getElementById(id);
  let farbe;

  // Wert zwischen zwei Bildnummern, außerhalb festgehalten; weich = sanft an- und abbremsen
  const zw = (f, [a, b], [x, y], weich) => {
    let t = Math.min(1, Math.max(0, (f - a) / (b - a)));
    if (weich) t = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    return x + (y - x) * t;
  };
  // Fester Pseudozufall je Stein, damit jeder Render identisch ist.
  const zufall = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
  // Höhe einer Steinecke: links von der Schleiflinie plan, rechts davon roh.
  const ecke = (stein, rechts, x, schleifX) =>
    x < schleifX ? OBERKANTE : OBERKANTE - 6 - zufall(stein * 2 + (rechts ? 1 : 0)) * 34;
  const oberflaeche = (x, schleifX) => {
    const i = Math.floor(x / STEIN), t = x / STEIN - i;
    const l = ecke(i, false, i * STEIN, schleifX), r = ecke(i, true, (i + 1) * STEIN, schleifX);
    return l + (r - l) * t;
  };
  const pflaster = (schleifX, c) => Array.from({ length: W / STEIN }, (_, i) => {
    const xl = i * STEIN + 7, xr = (i + 1) * STEIN - 7, unten = OBERKANTE + 100;
    return `<polygon points="${xl},${ecke(i, false, xl, schleifX)} ${xr},${ecke(i, true, xr, schleifX)} ${xr},${unten} ${xl},${unten}" fill="${c}" stroke="${c}" stroke-width="8" stroke-linejoin="round"/>`;
  }).join("");
  const rad = (x, schleifX, c) => {
    const y = oberflaeche(x, schleifX) - RADIUS - 12;
    const speichen = [0, 45, 90, 135].map((w) => `<line x1="${-RADIUS}" x2="${RADIUS}" transform="rotate(${w})" stroke-width="3"/>`).join("");
    return `<g transform="translate(${x} ${y}) rotate(${(x / RADIUS) * 180 / Math.PI})" stroke="${c}" fill="none"><circle r="${RADIUS}" stroke-width="12"/>${speichen}<circle r="9" fill="${c}"/></g>`;
  };
  const zeigen = (el, an) => { el.style.display = an ? "" : "none"; };
  const wischer = (szene, kante, x) => {
    szene.style.clipPath = `inset(0 ${Math.max(0, W - x)}px 0 0)`;
    kante.style.left = x - 5 + "px";
    zeigen(kante, x > -5 && x < W);
  };

  function start(ci, T) {
    farbe = {
      gruen: ci.palette["feind-gruen"], anthrazit: ci.palette.anthrazit, weiss: ci.palette.weiss,
      hell: ci.tokens.light["surface-muted"], "auf-gruen": ci.tokens.light["on-accent-strong"],
      tief: ci.tokens.dark["surface-inverse"],
    };
    for (const [k, v] of Object.entries(farbe)) document.documentElement.style.setProperty("--" + k, v);
    const zeilen = (liste) => liste.map((t) => `<div>${t}</div>`).join("");
    $("t1").innerHTML = zeilen(T.akt1);
    $("t2").textContent = T.akt2;
    $("lv").textContent = T.vorher;
    $("ln").textContent = T.nachher;
    $("t3").innerHTML = zeilen(T.akt3.split(/(?<=[.!?])\s+/));
    return ENDE;
  }

  function bild(f) {
    // Akt 1: Grafik – rauer Bestand, das Rad holpert
    zeigen($("a1"), f < A2 + 12);
    [...$("t1").children].forEach((z, i) => { z.style.opacity = zw(f, [8 + i * 22, 14 + i * 22], [0, 1]); });
    $("g1").innerHTML =
      `<rect x="120" y="530" height="10" fill="${farbe.gruen}" width="${zw(f, [72, 98], [0, 900], true)}"/>` +
      pflaster(-1, farbe.anthrazit) + rad(zw(f, [0, A2 + 12], [-RADIUS - 20, 1500]), -1, farbe.anthrazit);

    // Akt 2a: die Maschine auf dem Pflaster
    zeigen($("a2"), f >= A2 - 12 && f < VN);
    wischer($("a2"), $("k1"), zw(f, [A2 - 12, A2 + 12], [-10, W + 10], true));
    $("maschine").style.transform = `scale(${zw(f, [A2 - 12, VN], [1, 1.06])})`;
    const rein = 1 - Math.pow(1 - zw(f, [A2 + 16, A2 + 36], [0, 1]), 3);
    $("t2").style.transform = `translateX(${(rein - 1) * 1200}px)`;

    // Akt 2b: echtes Vorher/Nachher – die grüne Linie schleift durchs Foto
    zeigen($("vn"), f >= VN && f < A3 + 12);
    wischer($("nach"), $("k3"), zw(f, [VN + 14, VN + 52], [-10, W + 10], true));

    // Akt 3: Grafik – dieselben Steine, jetzt plan; Schlusssatz und Logo
    const g = f - A3;
    zeigen($("a3"), f >= A3 - 12);
    wischer($("a3"), $("k2"), zw(f, [A3 - 12, A3 + 12], [-10, W + 10], true));
    const schleifX = zw(g, [26, 92], [-20, W + 20], true);
    $("g3").innerHTML = pflaster(schleifX, farbe.tief) +
      `<rect x="0" y="${OBERKANTE - 12}" width="${Math.max(0, schleifX)}" height="10" fill="${farbe.gruen}"/>` +
      `<rect x="${schleifX - 5}" y="${OBERKANTE - 110}" width="10" height="210" fill="${farbe.gruen}"/>` +
      rad(zw(g, [84, ENDE - A3], [-RADIUS - 20, 1180]), schleifX, farbe.weiss);
    [...$("t3").children].forEach((z, i) => { z.style.opacity = zw(g, [70 + i * 16, 80 + i * 16], [0, 1]); });
    $("logo").style.opacity = zw(g, [104, 120], [0, 1]);
  }
</script>
