# Konfiguration seo_reporting – nach config.yaml kopieren und anpassen.
# Geheimnisse (Service-Account, SMTP-Passwort) NICHT hier, sondern per ENV/Datei.

# Search Console Property: Domain-Property "sc-domain:..." oder URL-Präfix "https://www.fraesdienst-feind.de/"
site_url: "sc-domain:fraesdienst-feind.de"

# GA4 Property-ID (nur Zahl; GA4 Admin → Property-Einstellungen). ENV: GA4_PROPERTY_ID
ga4_property_id: ""

# Service-Account-JSON (ENV GOOGLE_APPLICATION_CREDENTIALS oder GOOGLE_SERVICE_ACCOUNT_JSON überschreibt)
credentials_file: "credentials/service-account.json"

# Markenbegriffe (Groß-/Kleinschreibung und Umlaute werden normalisiert)
brand_terms:
  - "fräsdienst feind"
  - "feind fräsdienst"
  - "e. feind gmbh"
  - "e feind gmbh"
  - "e. feind"
  - "feind gmbh"
  - "enrico feind"
  - "fraesdienst-feind"

# Keyword-Cluster – Quelle: Notion „Marketing-Scan" (SEO-Scan, Keyword-Cluster) und
# „Marketing-Audit August 2026" (Empfohlene Keyword-Struktur), Stand 09/2026.
# Reihenfolge = Priorität: Die erste Übereinstimmung gewinnt, daher stehen die spezifischen
# Cluster (Region, Zielgruppe, Problem) vor den allgemeinen Leistungsbegriffen.
# Markenanfragen landen automatisch im Cluster „Marke".
clusters:
  - name: "Regional"
    patterns:
      - "brandenburg"
      - "berlin"
      - "sachsen"
      - "mecklenburg"
      - "vorpommern"
      - "lübben"
      - "luebben"
      - "wittenburg"
      - "cottbus"
      - "potsdam"
      - "dresden"
      - "leipzig"
      - "magdeburg"
      - "rostock"
      - "schwerin"
      - "hamburg"
      - "norddeutschland"
      - "ostdeutschland"
      - "deutschlandweit"
      - "in der nähe"
      - "umgebung"
      - "region"
  - name: "Zielgruppen"
    patterns:
      - "bauunternehmen"
      - "kommune"
      - "tiefbau"
      - "straßenbau"
      - "straßenmeisterei"
      - "flughafen"
      - "flugplatz"
      - "galabau"
      - "gala-bau"
      - "landschaftsbau"
      - "planungsbüro"
      - "generalunternehmer"
      - "industrie"
  - name: "Problembezogen"
    patterns:
      - "abfräsen"
      - "fräsen lassen"
      - "schleifen lassen"
      - "entfernen"
      - "bearbeiten"
      - "sanieren"
      - "sanierung"
      - "ausbessern"
      - "belag"
      - "unebenheit"
      - "spurrinne"
      - "griffigkeit"
      - "entwässerung"
      - "kosten"
      - "preis"
      - "was kostet"
  - name: "Spezialverfahren (Grinding, Grooving, Nutfräsen)"
    patterns:
      - "grinding"
      - "grooving"
      - "diamond"
      - "pflasterschleifen"
      - "pflaster schleifen"
      - "schleifen"
      - "nutfräsen"
      - "nut fräsen"
      - "schlitz"
      - "rillen"
      - "texturier"
      - "3d-fräsen"
      - "3d fräsen"
      - "nivellier"
      - "überbreite"
      - "fugenschneiden"
      - "fugen schneiden"
  - name: "Flächengröße (Klein-, Groß-, Feinfräsen)"
    patterns:
      - "kleinfläche"
      - "kleinflächen"
      - "großfläche"
      - "großflächen"
      - "feinfräs"
      - "kleinfräse"
      - "großfräse"
      - "fräsbreite"
      - "frästiefe"
  - name: "Service (Kehrsauger, Fräsgut, Räumung)"
    patterns:
      - "kehrsauger"
      - "kehrsaug"
      - "fräsgut"
      - "aufnehmen"
      - "baustellenreinigung"
      - "räumen"
      - "räumung"
      - "rundum"
      - "abtransport"
      - "entsorg"
      - "recycling"
      - "ausbauasphalt"
  - name: "Hauptleistungen (Kalt-, Asphalt-, Betonfräsen)"
    patterns:
      - "kaltfräs"
      - "asphaltfräs"
      - "betonfräs"
      - "straßenfräs"
      - "fräsarbeit"
      - "fräsdienst"
      - "frässervice"
      - "fräsen"
      - "fräsung"
      - "schneiden"
      - "asphalt"
      - "beton"

# CRM-Export: CSV oder XLSX, nur Datum/Quelle/Status/Wert (keine personenbezogenen Daten). ENV: CRM_EXPORT_PATH
crm:
  export_path: "data/crm/leads.csv"
  date_column: "created_at"
  source_column: "source"
  status_column: "status"
  value_column: "value"
  won_statuses: ["gewonnen", "won", "auftrag"]
  date_format: null   # z. B. "%d.%m.%Y"; null = automatisch (Tag zuerst)

# Schwellen für Cluster-Bewegungen
thresholds:
  cluster_click_change_pct: 15     # Monat: |Δ Klicks| ≥ 15 %
  weekly_click_change_pct: 20      # Woche: |Δ Klicks| ≥ 20 %
  cluster_position_change: 1.0     # |Δ Ø Position| ≥ 1,0
  min_clicks: 10                   # Cluster/Query unter 10 Klicks werden ignoriert
  top_n: 15

# Wochen-Check zusätzlich mit YoY-Vergleich (default aus)
weekly_yoy: false

output_dir: "output"
timezone: "Europe/Berlin"

# E-Mail-Versand (--email). Passwort nur über ENV SMTP_PASSWORD.
email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  sender: ""
  recipients: []
  subject_prefix: "[SEO-Report fraesdienst-feind.de]"
